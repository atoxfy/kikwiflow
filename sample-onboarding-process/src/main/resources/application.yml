server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: onboarding-service
  threads:
    virtual:
      enabled: true
  data:
    mongodb:
      uri: {YOUR_MONGO_URI}
      database: kikwiflow_db
      auto-index-creation: true
kikwiflow:
  process-definition:
    auto-deploy:
      enabled: true
  security:
    deploy-enabled: true

  execution:
    task-acquisition-interval-millis: 1000
    task-acquisition-max-tasks: 12
    max-concurrent-tasks: 200
    shutdown-grace-period-seconds: 30
    lock-timeout-millis: 1200
  retry:
    default-retry-interval: PT1M
    fatal-exceptions:
      - java.lang.NullPointerException
      - java.lang.IllegalArgumentException
  rest:
   # base-path: "engine/teste"
    cors:
      allowed-origins: "http://localhost:3001"
  stats:
    enabled: false
  outbox:
    events-enabled: true
  pulse:
    sse-endpoints:
      enabled: true #Default true
      interval: 5000 # default 5000





